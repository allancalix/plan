[package]
name = "plan"
version = "0.1.0-alpha.1"
edition = "2024"

[features]
test-clock = []

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
shlex = "2.0.1"

[lib]
name = "plan"
path = "src/lib.rs"

[[bin]]
name = "plan"
path = "src/bin.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.12.0"
rand = "0.10.3"
tempfile = "3.27.0"
