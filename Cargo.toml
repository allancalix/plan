[package]
name = "plan"
version = "0.1.0-alpha.1"
edition = "2024"

[features]
test-clock = []

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
shlex = "2.0.1"

[lib]
name = "plan"
path = "src/lib.rs"

[[bin]]
name = "plan"
path = "src/bin.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
hegeltest = { version = "0.51.0", features = ["static-engine"] }
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
